name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests && ruff format --check src tests
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest --cov=sipl --cov-report=term --cov-fail-under=80
      - name: CLI smoke test
        run: |
          sipl check examples/valid/power.sipl
          sipl run examples/valid/power.sipl --set X=5 --set Y=2 --json
          sipl term examples/valid/power.sipl --format plain

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: python -m pip install build && python -m build
      - name: Install wheel in a clean venv
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/sipl run examples/valid/geometric_sum_3.sipl --set N=3
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Package VS Code extension
        working-directory: vscode-sipl
        run: npx --yes @vscode/vsce package --out sipl.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: vscode-sipl/sipl.vsix
