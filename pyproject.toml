[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sipl-toolkit"
version = "0.5.0"
description = "Parser, interpreter, semantic terms and parse-tree visualization for the SIPL teaching language"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Nikita Slobozhanin" }]
keywords = ["sipl", "interpreter", "semantics", "education", "parser"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Software Development :: Interpreters",
]
dependencies = ["lark>=1.1.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.5"]

[project.scripts]
sipl = "sipl.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/sipl"]

[tool.hatch.build.targets.sdist]
include = ["src/sipl", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["sipl"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/sipl"]

[[tool.mypy.overrides]]
module = ["lark.*"]
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["sipl", "conftest"]
